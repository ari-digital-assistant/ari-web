<!doctype html>
<!-- Source for site/src/assets/og/skill-card.png: the background of every
     skill page's link-preview card. The right-hand side is left empty on
     purpose. At build time site/src/pages/og/skills/[id].jpg.js draws a phone
     there and puts the skill's first screenshot in it, so the glow below sits
     behind where that phone lands. Regenerate with scripts/render-og.sh. -->
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="card.css" />
<style>
  .g1{right:-180px; top:20px}
  h1{font-size:80px}
  .sub{margin-top:26px; font-size:28px; line-height:1.3; font-weight:600; color:#C9B5B9; max-width:22ch}
</style>
</head>
<body>
  <div class="glow g3"></div>
  <div class="glow g1"></div>
  <div class="glow g2"></div>
  <div class="grain"></div>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <linearGradient id="sg" x1="40" y1="60" x2="210" y2="215" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#FCA72E"/><stop offset=".45" stop-color="#FD6A21"/>
        <stop offset=".78" stop-color="#F73E1E"/><stop offset="1" stop-color="#D01717"/>
      </linearGradient>
      <symbol id="ari" viewBox="0 0 250 250"><g fill="url(#sg)">
      <path d="m239.1,66.77h-29.06c-4.5,0 -6.61,3.19 -6.61,6.85v24.3c0,3.8 2.21,6 6.02,6h29.06c4.83,0 6.26,-2.75 6.26,-6v-25.29c0,-3.25 -2.42,-5.86 -5.67,-5.86z"/>
      <path d="m160.6,39.74c-2.51,-5.23 -5.17,-6.74 -11.95,-6.74h-55.48c-7.29,0 -11.19,3.76 -13.25,8.74l-74.65,165c-1.97,4.44 0.09,8.44 5.69,8.44h55.03c5.97,0 8.82,-2.4 10.98,-7.39l43.28,-95.68h3.25c4.05,0 5.93,1.69 7.53,5.72 1.23,2.66 3.24,3.13 6.4,3.13h55.07c3.71,0 3.95,-2.06 2.72,-4.72l-34.62,-76.53z"/>
      <path d="m146.3,140.3c-4.4,0 -5.99,3.85 -4.35,8.1l26.76,61.33c1.78,3.9 4.99,5.47 9.59,5.47h52.63c6.02,0 6.87,-4.35 4.81,-8.53l-29.19,-60.97c-1.83,-3.66 -4.34,-5.4 -8.05,-5.4h-52.2z"/>

      </g></symbol>
    </defs>
  </svg>


  <div class="copy">
    <div class="lockup">
      <svg aria-hidden="true"><use href="#ari"/></svg>
      Ari
    </div>
    <h1>Teach Ari a <span class="grad">new trick.</span></h1>
    <p class="sub">Signed, open, and installable from inside the app.</p>
    <div class="url">heyari.dev/skills</div>
  </div>
</body>
</html>
