name: build-test-deploy
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }

permissions:
  contents: read
  id-token: write   # OIDC role assumption for AWS

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci
      - name: Audit (fail on high+ vulnerabilities)
        run: npm run audit
      - run: npm test
      - run: npm run build
      - run: npm run assemble
      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with: { name: dist, path: dist }

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-2
      - name: Deploy
        run: ./deploy.sh
        env:
          BUCKET: heyari-dev-static
          DIST_ID: E3DZC8ECXAT4FZ

# Setup note (one-time, human): create the AWS_DEPLOY_ROLE_ARN repo secret for an IAM
# role scoped to s3:*Object/s3:ListBucket on heyari-dev-static and
# cloudfront:CreateInvalidation on the distribution, trusting the GitHub OIDC provider
# for this repo. If OIDC isn't set up yet, fall back to AWS_ACCESS_KEY_ID/
# AWS_SECRET_ACCESS_KEY secrets and aws-actions/configure-aws-credentials with those.
